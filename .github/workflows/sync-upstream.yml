name: Sync fork with upstream

on:
  schedule:
    # Daily at 01:00 UTC. Must live on the default branch (main) for the
    # schedule trigger to fire at all. Deliberately a few hours ahead of
    # marvin's local 04:00 CEST/CET `rebuild.sh` run, so the build-marvin-app
    # job below normally has a finished, downloadable release ready by then
    # regardless of DST.
    - cron: "0 1 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync-main:
    runs-on: ubuntu-latest
    outputs:
      main_sha: ${{ steps.push.outputs.sha }}
    steps:
      - name: Checkout main (full history)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          submodules: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/manaflow-ai/cmux.git
          git fetch upstream main

      - name: Rebase main onto upstream/main, keeping only this workflow
        # main tracks upstream/main exactly, plus this one workflow file, so
        # it stays eligible for scheduled triggers without drifting from
        # upstream otherwise.
        run: |
          set -euo pipefail
          git rebase upstream/main

      - name: Push rebased main
        id: push
        run: |
          git push --force-with-lease origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # marvin is the permanent record of this fork's own work (whatever's been
  # merged into it via a normal PR), kept current with upstream by rebasing
  # -- never reset/rebuilt from scratch. A reset-and-replay design used to
  # live here (marvin = main + squash of currently *open* PRs, rebuilt from
  # scratch every run); it silently discarded any commit merged straight
  # into marvin the moment its PR closed, since a merged PR is no longer
  # "open" and main never contained it either. See the incident where a
  # merged border-rendering fix vanished within a day.
  sync-marvin:
    needs: sync-main
    runs-on: ubuntu-latest
    outputs:
      marvin_sha: ${{ steps.rebase.outputs.sha }}
    steps:
      - name: Checkout marvin (full history)
        uses: actions/checkout@v4
        with:
          ref: marvin
          fetch-depth: 0
          submodules: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/manaflow-ai/cmux.git
          git fetch upstream main

      - name: Rebase marvin onto upstream/main
        id: rebase
        run: |
          set -euo pipefail
          if ! git rebase upstream/main; then
            git rebase --abort
            echo "WARN: rebase onto upstream/main conflicted; leaving marvin as-is" >&2
          fi
          git push --force-with-lease origin HEAD:marvin
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build-marvin-app:
    needs: sync-marvin
    # This fork has no self-hosted/blacksmith runners or code-signing
    # secrets, so build ad-hoc-signed (CODE_SIGNING_ALLOWED=NO) on a plain
    # GitHub-hosted macOS runner instead of reusing upstream's heavier
    # nightly.yml (which needs infra we don't have). This is a public repo,
    # so hosted macOS runner minutes are free.
    runs-on: macos-15
    # A vanilla hosted macOS runner has no Xcode compilation cache warm (unlike
    # upstream's blacksmith-backed nightly.yml), so a from-scratch universal
    # Release build of this many Swift packages can run well past an hour.
    timeout-minutes: 180
    steps:
      - name: Checkout marvin at synced sha
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.sync-marvin.outputs.marvin_sha }}
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Squash open PRs on top for preview
        # Lets an in-progress PR be exercised in tonight's build before
        # it's merged. Pushed only to the disposable marvin-nightly-build
        # branch (recreated every run) -- never to marvin, so a PR that
        # never merges can't leave anything behind.
        id: preview
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh pr list --repo "${{ github.repository }}" --state open \
            --json number,headRefName,title \
            --jq '.[] | "\(.number)\t\(.headRefName)\t\(.title)"' \
            > /tmp/open-prs.tsv
          cat /tmp/open-prs.tsv
          while IFS=$'\t' read -r number head_ref title; do
            git fetch origin "$head_ref"
            git merge --squash FETCH_HEAD
            git commit -m "$title (#$number)"
          done < /tmp/open-prs.tsv
          git submodule update --init --recursive
          git push --force-with-lease origin HEAD:marvin-nightly-build
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Select Xcode
        run: ./scripts/select-ci-xcode.sh

      - name: Install Rust toolchain
        run: ./scripts/install-rust-ci.sh

      - name: Install Zig toolchain
        run: ./scripts/install-zig-ci.sh

      - name: Fetch prebuilt GhosttyKit.xcframework
        run: ./scripts/download-prebuilt-ghosttykit.sh

      - name: Build cmux.app (Release)
        run: |
          set -euo pipefail
          xcodebuild -project cmux.xcodeproj -scheme cmux -configuration Release \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build

      - name: Locate built app and zip it
        run: |
          set -euo pipefail
          app_path="$(find ~/Library/Developer/Xcode/DerivedData -maxdepth 6 -path '*/Build/Products/Release/cmux.app' -print -quit)"
          if [ -z "$app_path" ] || [ ! -d "$app_path" ]; then
            echo "Could not locate built cmux.app under DerivedData" >&2
            exit 1
          fi
          echo "Built app: $app_path"
          products_dir="$(dirname "$app_path")"
          ditto -c -k --sequesterRsrc --keepParent "$app_path" "$RUNNER_TEMP/cmux.app.zip"
          ls -lh "$RUNNER_TEMP/cmux.app.zip"
          unzip -l "$RUNNER_TEMP/cmux.app.zip" | head -20

      - name: Write build sha marker
        run: echo "${{ steps.preview.outputs.sha }}" > "$RUNNER_TEMP/sha.txt"

      - name: Publish floating marvin-nightly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag=marvin-nightly
          if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release delete "$tag" --repo "${{ github.repository }}" --yes --cleanup-tag
          fi
          gh release create "$tag" \
            --repo "${{ github.repository }}" \
            --title "cmux marvin nightly build" \
            --notes "Automated Release build of marvin (${{ needs.sync-marvin.outputs.marvin_sha }}) plus any open PRs squashed on top for preview. Floating release, recreated on every sync-upstream.yml run." \
            --target "${{ steps.preview.outputs.sha }}" \
            "$RUNNER_TEMP/cmux.app.zip#cmux.app.zip" \
            "$RUNNER_TEMP/sha.txt#sha.txt"
